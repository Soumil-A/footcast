[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "footcast"
version = "0.1.0"
description = "Premier League match outcome prediction and analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
]

[project.scripts]
footcast-data = "footcast.data.pipeline:main"
footcast-explore = "footcast.exploration:main"
footcast-features = "footcast.features.build_features:main"
footcast-baselines = "footcast.models.run_baselines:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/footcast"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
  "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:seaborn.matrix",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
