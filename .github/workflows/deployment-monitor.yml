name: Public deployment monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footcast-public-monitor
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ vars.FOOTCAST_API_URL != '' && vars.FOOTCAST_DASHBOARD_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FOOTCAST_PUBLIC_API_URL: ${{ vars.FOOTCAST_API_URL }}
      FOOTCAST_PUBLIC_DASHBOARD_URL: ${{ vars.FOOTCAST_DASHBOARD_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public product and serving provenance
        run: python -m footcast.monitoring
